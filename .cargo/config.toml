# V0 becomes the default symbol mangling scheme in Rust 1.97, so this can be removed after upgrading.
[target.'cfg(all())']
rustflags = ["-C", "symbol-mangling-version=v0"]

[target.'cfg(target_os = "windows")']
rustflags = ["-C", "control-flow-guard"]

# If running on x86_64, use x86-64-v3 CPU target which contains SIMD features like avx2 and fma. Change to
# x86-64 if you have an older x86_64 target without those SIMD features available. You can also override this
# by setting RUSTFLAGS in the enviornment: RUSTFLAGS="-C target-cpu=x86-64"
[target.'cfg(target_arch="x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]

# If running on an Aarch64 CPU, this enables the `neon` and `dotprod`.
#
# Generally speaking, CPUs like Apple M-series and Graviton 2+ will support `dotprod`, so
# enabling this seems acceptable.
[target.'cfg(target_arch="aarch64")']
rustflags = ["-C", "target-feature=+neon,+dotprod"]

[build]
target-dir = "target"
