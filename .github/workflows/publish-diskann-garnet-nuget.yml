name: Publish diskann-garnet NuGet

on:
  push:
    tags:
      - "diskann-garnet-v*"

env:
  RUST_CONFIG: 'target."cfg(all())".rustflags=["-Z", "stack-protector=all"]'
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: linux
            lib-path: target/release/libdiskann_garnet.so
          - os: windows-latest
            artifact-name: windows
            lib-path: target/release/diskann_garnet.dll
            pdb-path: target/release/diskann_garnet.pdb
          - os: macos-26
            artifact-name: macos-arm64
            lib-path: target/release/libdiskann_garnet.dylib

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build diskann-garnet (release)
        shell: bash
        env:
          RUSTC_BOOTSTRAP: 1
        run: cargo build --locked --release --package diskann-garnet --config "$RUST_CONFIG"

      - name: Stage native library
        shell: bash
        run: |
          mkdir -p staging
          cp "${{ matrix.lib-path }}" staging/
          if [ -n "${{ matrix.pdb-path }}" ] && [ -f "${{ matrix.pdb-path }}" ]; then
            cp "${{ matrix.pdb-path }}" staging/
          fi

      - name: Upload native artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact-name }}
          path: staging/
          if-no-files-found: error

  package:
    name: package and publish
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version consistency
        shell: bash
        run: |
          NUSPEC_VER=$(sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' diskann-garnet/diskann-garnet.nuspec)
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' diskann-garnet/Cargo.toml | head -1)
          echo "nuspec version: $NUSPEC_VER"
          echo "Cargo.toml version: $CARGO_VER"

          if [ "$NUSPEC_VER" != "$CARGO_VER" ]; then
            echo "::error::Version mismatch: nuspec=$NUSPEC_VER vs Cargo.toml=$CARGO_VER"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/diskann-garnet-v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/diskann-garnet-v}"
            echo "tag version: $TAG_VER"
            if [ "$TAG_VER" != "$NUSPEC_VER" ]; then
              echo "::error::Tag version ($TAG_VER) does not match package version ($NUSPEC_VER)"
              exit 1
            fi
          fi

      - name: Create staging directory
        shell: bash
        run: mkdir -p staging/linux staging/windows staging/macos-arm64 staging/docs

      - name: Download Linux artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: staging/linux/

      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: staging/windows/

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-arm64
          path: staging/macos-arm64/

      - name: Copy docs
        shell: bash
        run: cp diskann-garnet/README.md staging/docs/README.md

      - name: Copy nuspec to staging
        shell: bash
        run: cp diskann-garnet/diskann-garnet.nuspec staging/

      - name: Install NuGet CLI
        uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

      - name: Pack NuGet package
        working-directory: staging
        run: nuget pack diskann-garnet.nuspec -NonInteractive

      - name: Verify nupkg contents
        shell: bash
        working-directory: staging
        run: |
          echo "=== NuGet package files ==="
          ls -lh *.nupkg
          echo ""
          echo "=== Package contents ==="
          unzip -l *.nupkg
          for native_library in \
            runtimes/linux-x64/native/libdiskann_garnet.so \
            runtimes/win-x64/native/diskann_garnet.dll \
            runtimes/win-x64/native/diskann_garnet.pdb \
            runtimes/osx-arm64/native/libdiskann_garnet.dylib; do
            unzip -t *.nupkg "$native_library"
          done

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: staging/*.nupkg
          if-no-files-found: error

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/diskann-garnet-v')
        working-directory: staging
        run: dotnet nuget push *.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
