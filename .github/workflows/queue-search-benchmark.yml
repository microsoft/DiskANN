name: Queue insertion search benchmark

on:
  pull_request:
    branches: [wuw92-beam-queue-benchmark]
    paths:
      - 'diskann/src/neighbor/**'
      - 'diskann-benchmark/**'
      - '.github/scripts/benchmark_queue_search.py'
      - '.github/scripts/test_benchmark_queue_search.py'
      - '.github/workflows/queue-search-benchmark.yml'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  QUEUE_BASE_SHA: ${{ github.event.pull_request.base.sha }}

concurrency:
  group: queue-search-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  compare:
    name: Queue search (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch exact benchmark base
        run: git fetch --no-tags --depth=1 origin "$QUEUE_BASE_SHA"
      - name: Describe environment
        run: |
          mkdir -p benchmark-results
          {
            echo "Runner: $RUNNER_OS $RUNNER_ARCH"
            echo "Head: $(git rev-parse HEAD)"
            echo "Base: $QUEUE_BASE_SHA"
            echo "Build: cargo build --locked --release -p diskann-benchmark -vv"
            echo "Linux timing affinity: first allowed logical CPU; Windows: inherited affinity"
            rustc --version --verbose
            python -c "import platform; print(platform.platform()); print(platform.processor())"
            if [ "$RUNNER_OS" = Windows ]; then
              powershell -NoProfile -Command 'Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors; Get-Process -Id $PID | Select-Object ProcessorAffinity'
            else
              lscpu
            fi
          } | tee benchmark-results/environment.txt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Validate checked-in implementation and benchmark
        run: |
          python .github/scripts/test_benchmark_queue_search.py
          cargo fmt --all -- --check
          cargo test --locked --release -p diskann-benchmark neighbor_queue
          cargo clippy --locked --release -p diskann -p diskann-benchmark --all-targets -- -D warnings
      - name: Build and test fixed variants
        run: |
          python .github/scripts/benchmark_queue_search.py build \
            --base "$QUEUE_BASE_SHA" --output benchmark-results
      - name: Compare independent processes
        run: |
          python .github/scripts/benchmark_queue_search.py run --output benchmark-results
          python .github/scripts/benchmark_queue_search.py summarize --output benchmark-results
          cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw results, binaries, sources, and commands
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: queue-search-${{ matrix.runner }}-${{ github.event.pull_request.head.sha }}
          path: benchmark-results/
          retention-days: 30
