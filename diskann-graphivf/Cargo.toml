[package]
name = "diskann-graphivf"
version.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
# The remaining diagnostic/dataprep harnesses live in category subdirectories under
# `scripts/`; each is declared explicitly below, so disable top-level autodiscovery.
autoexamples = false

[dependencies]
diskann.workspace = true
diskann-disk.workspace = true
diskann-linalg.workspace = true
diskann-providers.workspace = true
diskann-quantization.workspace = true
diskann-utils.workspace = true
diskann-vector.workspace = true
bytemuck.workspace = true
byteorder.workspace = true
half = { workspace = true, features = ["bytemuck", "num-traits"] }
rand.workspace = true
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
diskann = { workspace = true, features = ["testing"] }
diskann-utils = { workspace = true, features = ["testing"] }
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# Building, searching and profiling a graph-IVF index is done through the shared
# benchmark harness (`diskann-benchmark`, feature `graph-ivf`) — see
# `scripts/README.md`. What remains here are the two tools that harness does not
# cover: corpus preparation, and a centroid-graph quality diagnostic. Each is
# declared explicitly (top-level autodiscovery is disabled in `[package]`); the
# `name` is the produced binary name and is kept stable regardless of source path.

# --- analysis/ : index-quality diagnostics ---
[[example]]
name = "centroid_graph_ablation"
path = "scripts/analysis/centroid_graph_ablation.rs"

# --- dataprep/ : corpus/query compression utilities ---
[[example]]
name = "compress_minmax"
path = "scripts/dataprep/compress_minmax.rs"
