[package]
name = "diskann-graphivf"
version.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
# Example harnesses live in category subdirectories under `scripts/`; each is
# declared explicitly below, so disable top-level autodiscovery.
autoexamples = false

[dependencies]
diskann.workspace = true
diskann-disk.workspace = true
diskann-providers.workspace = true
diskann-quantization.workspace = true
diskann-utils.workspace = true
diskann-vector.workspace = true
bytemuck.workspace = true
byteorder.workspace = true
half = { workspace = true, features = ["bytemuck", "num-traits"] }
rand.workspace = true
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
diskann = { workspace = true, features = ["testing"] }
diskann-utils = { workspace = true, features = ["testing"] }
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# Example harnesses live in category subdirectories under `scripts/` (build/,
# search/, analysis/, dataprep/); see `scripts/README.md` for a catalog. Each is
# declared explicitly (top-level autodiscovery is disabled in `[package]`); the
# `name` is the produced binary name and is kept stable regardless of source path.

# --- build/ : index construction (static, online, and centroid refinement) ---
[[example]]
name = "build_static"
path = "scripts/build/build_static.rs"

[[example]]
name = "build_online"
path = "scripts/build/build_online.rs"

# --- search/ : search sweeps and combined build+search harnesses ---
[[example]]
name = "sweep"
path = "scripts/search/sweep.rs"

# --- analysis/ : profiling, ablation, and disk-read reliability harnesses ---
[[example]]
name = "profile_layercake"
path = "scripts/analysis/profile_layercake.rs"

[[example]]
name = "centroid_graph_ablation"
path = "scripts/analysis/centroid_graph_ablation.rs"

# --- dataprep/ : corpus/query compression and subsampling utilities ---
[[example]]
name = "compress_minmax"
path = "scripts/dataprep/compress_minmax.rs"
