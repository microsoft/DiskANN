[package]
name = "diskann-providers"
version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bincode.workspace = true
bytemuck = { workspace = true, features = ["must_cast"]}
byteorder.workspace = true
half = { workspace = true, features = ["bytemuck", "num-traits"] }
hashbrown.workspace = true
num-traits.workspace = true
rand.workspace = true
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
diskann-vector = { workspace = true }
rand_distr.workspace = true
cfg-if.workspace = true
diskann-wide = { workspace = true }
arc-swap.workspace = true
tracing.workspace = true
# The workspace entry opts out of default features so the async runtime backend
# stays opt-in; the `tokio`/`compio` features below forward the backend choice.
diskann = { workspace = true }
diskann-utils = { workspace = true }
diskann-quantization = { workspace = true, features = ["rayon"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"], optional = true }
compio = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
prost = "0.14.1"
futures-util = { workspace = true, features = ["async-await"] }
vfs = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true
diskann = { workspace = true, features = ["testing"] }
diskann-utils = { workspace = true, features = ["testing"] }
itertools.workspace = true
tempfile.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = ["full"] }
proptest.workspace = true
vfs.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]

[features]
default = ["tokio", "tracing"]

# Use the tokio runtime for the synchronous index wrappers and forwarded task
# spawning (upstream default behavior).
tokio = ["dep:tokio", "diskann/tokio"]

# Use the compio (thread-per-core) runtime instead. When both `tokio` and
# `compio` are enabled, `tokio` takes precedence to preserve upstream behavior.
# At least one runtime backend must be enabled.
compio = ["dep:compio", "diskann/compio"]

# Forward tracing instrumentation of the `diskann` crate (enabled by default,
# matching the previous default-feature behavior).
tracing = ["diskann/tracing"]

testing = ["dep:tempfile"]
experimental_diversity_search = ["diskann/experimental_diversity_search"]
virtual_storage = ["dep:vfs"]

# Some 'cfg's in the source tree will be flagged by `cargo clippy -j 2 --workspace --no-deps --all-targets -- -D warnings`
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
allow_attributes = "warn"
# Commenting out for now. It would give warnings.
# undocumented_unsafe_blocks = "warn"
uninlined_format_args = "allow"

